name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Windows timezone data
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Compile Python sources
        run: python -m compileall -q harness integrations tests server
      - name: Harness unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Router server unit tests
        run: python -m unittest discover -s server -p "test_*.py" -v

  router:
    name: Embedded router (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: router/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - run: npm ci
      - name: Offline Jev configuration smoke
        run: python ../scripts/smoke_config_offline.py
      - name: Static checks
        run: npm run check
      - name: Focused routing and transport tests
        run: node --test test/error-chain.test.mjs test/fetch-transport.test.mjs test/transport-failure.test.mjs
      - name: Browser broker contract tests
        run: node --test ../tests/browser_broker.test.mjs
      - name: Fresh Codex client with controlled provider failure
        timeout-minutes: 3
        run: >-
          python -c "import os, subprocess, sys;
          repeats = 3 if os.name == 'nt' else 1;
          [subprocess.run([sys.executable, '../server/recovery_acceptance.py'], check=True)
          for _ in range(repeats)]"
      - name: Full router regression suite
        run: >-
          python -c "from pathlib import Path; import subprocess;
          subprocess.run(['node', '--test', '--test-concurrency=4', '--test-timeout=600000',
          *map(str, sorted(Path('test').glob('*.test.mjs')))], check=True)"

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Confirm installed tools
        run: |
          python --version
          node --version
          codex --version
      - name: Run install smoke
        run: python scripts/ci_install_smoke.py

  repository-hygiene:
    name: Tracked artifact and secret-path check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject runtime state, credentials, and oversized artifacts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          forbidden_parts = {
              ".runtime", ".codex", ".hermes", ".venv", "venv", "node_modules",
              "__pycache__", "credentials", "secrets",
          }
          forbidden_suffixes = {".pem", ".key", ".p12", ".pfx", ".sqlite", ".db", ".pyc", ".log"}
          problems = []
          for name in filter(None, paths):
              path = pathlib.Path(name)
              parts = {part.lower() for part in path.parts}
              if parts & forbidden_parts:
                  problems.append(f"forbidden tracked path: {name}")
              if path.suffix.lower() in forbidden_suffixes:
                  problems.append(f"forbidden tracked file type: {name}")
              if path.name.lower() in {"auth.json", "secrets.json", "credentials.json"}:
                  problems.append(f"credential file must not be tracked: {name}")
              if path.is_file() and path.stat().st_size > 25 * 1024 * 1024:
                  problems.append(f"tracked file exceeds 25 MiB: {name}")
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print(f"Checked {sum(bool(p) for p in paths)} tracked paths; no blocked state or large artifacts found.")
          PY
      - name: Build and verify local source archive
        run: python scripts/package_release.py --output "${RUNNER_TEMP}/jev-codex-harness-ci.tar.gz"
